<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#176b5b">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icons/icon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
</head>
<body data-base="{{ site.baseurl | escape }}" {% if page.day %}data-day="{{ page.day }}"{% endif %}>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">21</span><span>數學探險<span class="brand-sub">每天一點，想得更清楚</span></span></a>
    <nav aria-label="主要導覽"><a href="{{ '/' | relative_url }}#curriculum">課程目錄</a><a href="{{ '/' | relative_url }}#install">手機安裝</a><button type="button" id="theme-toggle" hidden aria-label="切換深色模式">深色</button></nav>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer"><span>21 天離散數學探險 · 給每一個好奇的你</span><span id="offline-status" role="status">連線後可儲存全套文章供離線閱讀。</span><button id="cache-retry" type="button" hidden>重新儲存離線內容</button><button id="update-app" type="button" hidden>新版已備妥，更新內容</button></footer>
  <noscript><p class="notice">文章與解答仍可直接閱讀。啟用 JavaScript 後，可記錄進度及使用離線功能。</p></noscript>
</body>
</html>
